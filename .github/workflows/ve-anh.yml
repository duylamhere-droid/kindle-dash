# Mỗi 15 phút: vẽ dash.png từ so/ → đăng lên GitHub Pages ở thư mục bí mật.
# Bí mật (Settings → Secrets): PAGES_DIR.
name: Vẽ ảnh Kindle
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["so/**", "ve/**", ".github/workflows/ve-anh.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ve-anh
  cancel-in-progress: true

jobs:
  ve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow

      - name: Vẽ ảnh
        env:
          CHROME: google-chrome
        run: python ve/ve.py --du-lieu so --ra ra

      - name: Chuẩn bị trang
        env:
          PAGES_DIR: ${{ secrets.PAGES_DIR }}
        run: |
          mkdir -p "site/$PAGES_DIR"
          cp ra/dash.png "site/$PAGES_DIR/"
          echo "ok" > site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Job riêng (theo mẫu GitHub): đăng ngay trong cùng job thì GitHub chưa kịp thấy ảnh vừa tải lên.
  dang:
    needs: ve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5
